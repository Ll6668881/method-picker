<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社科量化研究方法智能选型</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --line:#d3dcea; --ink:#222831; --muted:#64748b;
    --accent:#1b5ea0; --accent-soft:#e9f0f8; --warn:#b33a2e; --warn-soft:#f9efec;
    --ok:#237a4e; --ok-soft:#e8f3ec;
    --nav:#15406f; --nav2:#1d5290;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"SimSun","Songti SC","Microsoft YaHei","PingFang SC",sans-serif;
    line-height:1.75; font-size:15px;
  }
  .topbar{background:linear-gradient(180deg,var(--nav2),var(--nav));border-bottom:3px solid var(--accent)}
  .topbar .top-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .topbar .brand{color:#fff;font-family:"SimSun","Songti SC",serif;font-size:22px;font-weight:700;letter-spacing:1px}
  .topbar .brand em{font-style:normal;font-size:11px;color:#bcd3ec;margin-left:10px;letter-spacing:0}
  .topbar .slogan{color:#dbe7f5;font-size:12px}
  .container{max-width:1200px;margin:0 auto;padding:22px 20px 40px}
  .footer{background:var(--nav);color:#c9d9ec;font-size:12.5px;padding:14px 0;text-align:center;border-top:3px solid var(--accent);line-height:1.8}
  .banner{
    margin:14px 0 22px; padding:10px 16px; border:1px solid #e7d8a8;
    background:#fbf6e7; color:#7a6a2f; font-size:13px; border-radius:6px;
  }
  .wrap{display:flex;gap:24px;align-items:flex-start}
  .form-col{flex:0 0 400px;max-width:400px}
  .result-col{flex:1;min-width:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px 22px}
  .form-col .card{position:sticky;top:16px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:600;color:#3a4150;margin-bottom:6px}
  .field label .req{color:var(--warn)}
  .field .hint{font-size:12px;color:var(--muted);margin-top:4px}
  textarea,input[type=text],input[type=number],select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
    font-size:14px;font-family:inherit;background:#fcfcfd;color:var(--ink);
  }
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff}
  textarea{resize:vertical}
  .radios{display:flex;flex-direction:column;gap:6px}
  .radios label{display:flex;align-items:center;gap:8px;font-weight:400;font-size:14px;cursor:pointer}
  .radios input[type=radio]{accent-color:var(--accent);width:14px;height:14px}
  .btn-row{display:flex;gap:10px;margin-top:6px}
  .btn{
    padding:9px 16px;border-radius:6px;font-size:14px;cursor:pointer;border:1px solid transparent;
    font-family:inherit;transition:background .15s,border-color .15s;
  }
  .btn-primary{background:linear-gradient(180deg,#2a6cb8,#1b5ea0);color:#fff}
  .btn-primary:hover{background:linear-gradient(180deg,#1b5ea0,#15406f)}
  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-mini{padding:5px 10px;font-size:12px;border-color:var(--line);background:#fff;color:var(--accent)}
  .btn-mini:hover{border-color:var(--accent)}
  details.infer-box{margin-top:2px;border:1px dashed var(--line);border-radius:6px;padding:8px 10px}
  details.infer-box summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);user-select:none}
  details.infer-box summary:hover{color:#25507a}
  .infer-grid{display:flex;flex-direction:column;gap:10px;margin:8px 0 4px}
  .infer-label{font-size:12px;font-weight:600;color:var(--muted);margin:6px 0 2px}
  .infer-res{font-size:13px;margin-top:6px;padding:8px 10px;background:#f6f9fc;border:1px solid var(--line);border-radius:6px}
  .infer-res .t{font-weight:700;color:var(--accent);margin-bottom:2px}
  .infer-res .c{color:var(--muted);font-size:12.5px;margin-bottom:4px}
  .infer-res .dim{color:#9aa3af}
  .infer-res .fill{margin-top:4px}
  .result-placeholder{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px}
  .result-placeholder .big{font-size:40px;margin-bottom:10px;opacity:.5}
  .mod{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:18px 20px;margin-bottom:16px}
  .mod h3{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--ink);display:flex;align-items:center;gap:8px;border-left:4px solid var(--accent);padding-left:10px}
  .mod h3 .no{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-size:12px;flex:none}
  .mod p{font-size:14px;color:#3a4150;margin-bottom:8px}
  .mod ul{margin:4px 0 8px 20px;font-size:14px;color:#3a4150}
  .mod ul li{margin-bottom:6px}
  .mod ol li{margin-bottom:8px}
  .th-note{margin:6px 0 10px;padding:8px 10px;background:var(--accent-soft);border-left:3px solid var(--accent);font-size:13px;color:#3a4150}
  .th-link{font-size:13px;margin-top:4px;color:var(--muted)}
  .th-link a{color:var(--accent);text-decoration:underline}
  .th-link a:hover{color:#25507a}
  .rec-item{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:6px;padding:12px 14px;margin-bottom:12px;background:#fbfcfe}
  .rec-item .r-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .rec-item .r-name{font-size:15px;font-weight:700;color:var(--ink)}
  .rec-item .r-cat{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:10px;flex:none}
  .rec-item .r-intro{font-size:13px;color:var(--muted);margin:6px 0 10px}
  .scorebar{height:6px;background:#e9edf2;border-radius:3px;overflow:hidden;margin:4px 0 10px}
  .scorebar i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .rec-item .score-label{font-size:12px;color:var(--muted)}
  .rec-item h4{font-size:13px;font-weight:700;margin:10px 0 4px;color:#3a4150}
  .rec-item .pre{font-size:13px;color:#4a5260;padding-left:16px}
  .rec-item .pre li{margin-bottom:3px}
  code,pre{font-family:Consolas,"Courier New",monospace;font-size:12.5px}
  pre{background:#f6f7f9;border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;line-height:1.55;color:#2b2f36;margin:6px 0 10px}
  pre .c{color:#7a8494}
  .bad{display:flex;gap:8px;padding:8px 10px;border:1px solid #ecd9d2;background:var(--warn-soft);border-radius:6px;margin-bottom:8px;font-size:13.5px}
  .bad .nm{font-weight:700;color:var(--warn);flex:none}
  .bad .wy{color:#5a3a32}
  .note{font-size:12.5px;color:#7a6a2f;background:#fbf6e7;border:1px solid #e7d8a8;border-radius:6px;padding:8px 12px;margin-top:10px}
  .warn-note{font-size:12.5px;color:#5a3a32;background:var(--warn-soft);border:1px solid #ecd9d2;border-radius:6px;padding:8px 12px;margin-top:10px}
  .result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .result-head h2{font-size:17px;color:var(--accent)}
  .meta-line{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.9}
  .meta-line b{color:#3a4150}
  .paradigm{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:13.5px;line-height:2}
  .paradigm b{font-size:14px;padding:1px 8px;border-radius:4px}
  .paradigm .p-quant{color:#1b5ea0;background:var(--accent-soft)}
  .paradigm .p-qual{color:#8a4a1f;background:#f6efe4}
  .paradigm .p-mixed{color:#6b5a12;background:#fbf6e0}
  .paradigm .p-sub{font-size:12.5px;color:var(--muted)}
  @media (max-width:920px){
    .wrap{flex-direction:column}
    .form-col{flex:1;max-width:none;width:100%}
    .form-col .card{position:static}
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="top-inner">
    <div class="brand">社科量化研究方法智能选型</div>
    <div class="slogan">面向社会科学学生与研究者的量化/计量方法自动推荐工具 · 内置 15 种方法知识库</div>
  </div>
</div>
<div class="container">

  <div class="banner">⚠️ 本工具仅为辅助参考，正式论文仍需结合前沿文献、研究设计约束与审稿人意见进行最终判断。</div>

  <div class="wrap">
    <div class="form-col">
      <div class="card">
        <div class="field">
          <label>核心研究问题 <span class="req">*</span></label>
          <textarea id="f_question" rows="3" placeholder="例如：政策 A 是否影响个体 Y 结果？"></textarea>
          <div class="hint">一句话描述研究问题，尽量包含变量与情境</div>
        </div>

        <div class="field">
          <label>🧭 变量类型智能识别 <span class="hint">（可选 · 自动判断连续/二元/有序/计数/多分类）</span></label>
          <details class="infer-box" open>
            <summary>填写变量名称与详细描述 → 自动识别测量类型并填入下方表单</summary>
            <div class="infer-grid">
              <div>
                <div class="infer-label">自变量 X 名称</div>
                <input type="text" id="i_xname" placeholder="如：treat">
                <div class="infer-label">X 详细描述</div>
                <textarea id="i_xdesc" rows="2" placeholder="如：处理状态，1 表示受最低工资政策影响，0 表示未受影响"></textarea>
                <div id="i_xres"></div>
              </div>
              <div>
                <div class="infer-label">因变量 Y 名称</div>
                <input type="text" id="i_yname" placeholder="如：income">
                <div class="infer-label">Y 详细描述</div>
                <textarea id="i_ydesc" rows="2" placeholder="如：月收入，单位元，取值为非负实数"></textarea>
                <div id="i_yres"></div>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn-mini" id="btn_infer">自动识别类型</button>
              <button class="btn btn-mini" id="btn_infer_clear">清空</button>
            </div>
            <div class="hint">识别结果为参考建议，最终以你的数据测量手册为准</div>
          </details>
        </div>

        <div class="field">
          <label>因变量 Y 类型 <span class="req">*</span></label>
          <select id="f_y">
            <option value="continuous">连续数值</option>
            <option value="binary">二元 0-1</option>
            <option value="ordinal">有序分类</option>
            <option value="count">计数数据</option>
            <option value="multi">多分类（无序）</option>
          </select>
        </div>

        <div class="field">
          <label>核心自变量 X 类型 <span class="req">*</span></label>
          <select id="f_x">
            <option value="group2">分组二分处理（处理/对照）</option>
            <option value="continuous">连续变量</option>
            <option value="policy">政策冲击 / 时间断点</option>
            <option value="groupk">多分类分组</option>
          </select>
        </div>

        <div class="field">
          <label>研究目标 <span class="req">*</span></label>
          <div class="radios">
            <label><input type="radio" name="goal" value="desc" checked> 侧重相关描述（变量间关联与预测）</label>
            <label><input type="radio" name="goal" value="causal"> 追求因果效应识别（政策/干预效应）</label>
          </div>
        </div>

        <div class="field">
          <label>数据结构 <span class="req">*</span></label>
          <select id="f_data">
            <option value="cross">横截面</option>
            <option value="balPanel">平衡面板</option>
            <option value="unbalPanel">非平衡面板</option>
            <option value="repeat">重复截面</option>
            <option value="experiment">实验数据（随机分组）</option>
          </select>
        </div>

        <div class="field">
          <label>样本量大致规模</label>
          <input type="number" id="f_n" min="1" placeholder="如 500（选填，影响小样本方法建议）">
        </div>

        <div class="field">
          <label>可选补充信息</label>
          <textarea id="f_extra" rows="3" placeholder="例如：是否存在内生性、选择偏误、遗漏变量；是否存在分数/收入等断点；是否单个试点地区等"></textarea>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btn_run">开始分析</button>
          <button class="btn btn-ghost" id="btn_example">填入示例</button>
        </div>
      </div>
    </div>

    <div class="result-col">
      <div id="results"></div>
    </div>
  </div>
</div>

<footer class="footer">
  <div class="container" style="padding:0 20px">© 社科量化研究方法智能选型 · 本工具仅为辅助参考，正式论文仍需结合前沿文献、研究设计约束与审稿人意见进行最终判断</div>
</footer>

<script>
"use strict";

/* ========== 常量：选项中文名 ========== */
var YN = {continuous:"连续数值", binary:"二元 0-1", ordinal:"有序分类", count:"计数数据", multi:"多分类（无序）"};
var XN = {group2:"分组二分处理（处理/对照）", continuous:"连续变量", policy:"政策冲击/时间断点", groupk:"多分类分组"};
var DN = {cross:"横截面", balPanel:"平衡面板", unbalPanel:"非平衡面板", repeat:"重复截面", experiment:"实验数据（随机分组）"};
var GN = {desc:"侧重相关描述", causal:"追求因果效应识别"};
var CATN = {basic:"基础假设检验", reg:"回归建模", causal:"因果推断"};

/* ========== 知识库：15 种方法 ==========
   fit: 四维匹配度（0-1）
     y  : 因变量类型匹配   x  : 自变量类型匹配
     d  : 数据结构匹配     g  : 研究目标匹配
   pre   : 适用前提
   tests : 关键检验
   pits  : 常见误区
   stata / r : 操作步骤
   rationale : 选择理由模板（{q}{y}{x}{d}{g} 占位符） */

var KB = {

/* 1. 卡方检验 */
chisq:{
  full:"卡方独立性检验（Chi-square Test）", cat:"basic",
  intro:"检验两个分类变量之间是否存在统计关联，基于观察频数与期望频数的差异。",
  fit:{y:{continuous:0.1,binary:0.95,ordinal:0.85,count:0.35,multi:0.95}, x:{group2:0.85,continuous:0.2,policy:0.35,groupk:1.0}, d:{cross:1.0,balPanel:0.25,unbalPanel:0.25,repeat:0.45,experiment:0.95}, g:{desc:1.0,causal:0.35}},
  pre:["两变量均为分类（名义/有序）测量","各观测独立","期望频数一般要求 ≥5（不满足时用 Fisher 精确检验）","仅描述关联，不推断因果"],
  stata:"tab X Y, chi2 row\n// row 显示行百分比，便于描述方向\n\ntab X Y, chi2 exact   // 小样本/期望频数不足时用精确检验\n\n* 效应量（Cramér's V）\nssc install tab_chi\ntab_chi X Y",
  r:"tbl <- table(X, Y)\nchisq.test(tbl)\n# 期望频数不足 5 时\nfisher.test(tbl, simulate.p.value = TRUE)\n# 效应量 Cramér's V\nlibrary(vcd); assocstats(tbl)",
  tests:["卡方统计量 χ² 与 p 值","期望频数检查（>20% 的单元格 <5 需谨慎）","Cramér's V 效应量","Fisher 精确检验（小样本）"],
  pits:["不能用于连续因变量，会丢失大量信息","有显著关联 ≠ 有因果","类别过多导致单元格稀疏、检验功效下降","未报告效应量，仅报告 p 值","把有序变量的趋势信息当作无序处理"],
  rationale:"针对研究问题「{q}」，因变量 {y} 与核心自变量 {x} 均为分类测量，研究目标为{g}。卡方独立性检验通过比较观察频数与期望频数的差异，检验两分类变量间是否存在统计关联，是列联表相关分析的标准方法；结合 Cramér's V 可度量关联强度。需注意该检验回答的是「是否相关」而非「为何相关」，在论文中应定位为描述性相关证据。"
},

/* 2. 独立样本 t 检验 */
ttest:{
  full:"独立样本 t 检验（Independent Samples t-test）", cat:"basic",
  intro:"比较两个独立分组（如处理组/对照组）在连续因变量上的均值是否存在显著差异。",
  fit:{y:{continuous:1.0,binary:0.1,ordinal:0.4,count:0.2,multi:0.1}, x:{group2:1.0,continuous:0.1,policy:0.45,groupk:0.3}, d:{cross:1.0,balPanel:0.35,unbalPanel:0.35,repeat:0.6,experiment:1.0}, g:{desc:1.0,causal:0.45}},
  pre:["因变量为连续测量","两组样本独立（无配对/重复关系）","每组近似正态（大样本下稳健）","方差齐性（不满足时采用 Welch 修正）"],
  stata:"* 方差齐性检验（Levene）\nrobvar Y, by(X)\n\n* 标准 t 检验\n.ttest Y, by(X)\n\n* 方差不齐时用 Welch 修正\n.ttest Y, by(X) unequal\n\n* 效应量 Cohen's d\n.estat esize",
  r:"# Levene 方差齐性检验\ncar::leveneTest(Y ~ X)\n# 标准 t 检验\n.t.test(Y ~ X, data = d)\n# Welch 修正（默认 var.equal = FALSE）\n.t.test(Y ~ X, data = d, var.equal = FALSE)\n# 效应量\n.effectsize::cohens_d(Y ~ X, data = d)",
  tests:["Levene/F 方差齐性检验","Shapiro-Wilk 正态性检验（小样本）","Cohen's d 效应量与 95% 置信区间","两组样本量与均值/中位数描述"],
  pits:["显著 ≠ 效应大，需报告效应量","多次两两比较会膨胀一类错误","样本非独立（如同一批人前后测）时误用独立样本检验","方差严重不齐且未做 Welch 修正"],
  rationale:"针对「{q}」，本研究比较 {x} 两个分组在连续因变量 {y} 上的均值差异。独立样本 t 检验将组间均值之差标准化为其标准误，在两组近似正态、方差齐性（否则用 Welch 修正）的假定下检验均值差是否显著异于零，是横截面/实验设计中两独立组均值比较的标准方法；论文中应同时报告均值、标准差、t 值、自由度与效应量。"
},

/* 3. 配对 t 检验 */
paired:{
  full:"配对样本 t 检验（Paired Samples t-test）", cat:"basic",
  intro:"比较同一批个体在前后两次测量（或匹配对象）上连续变量的均值差异，消除个体间异质性。",
  fit:{y:{continuous:1.0,binary:0.1,ordinal:0.35,count:0.2,multi:0.1}, x:{group2:0.6,continuous:0.1,policy:0.4,groupk:0.3}, d:{cross:0.2,balPanel:0.7,unbalPanel:0.6,repeat:0.9,experiment:0.75}, g:{desc:1.0,causal:0.4}},
  pre:["因变量连续，且观测成对出现（前后测/匹配对象）","差值的分布近似正态","配对关系真实存在（同一对象或严格匹配）"],
  stata:"* 宽格式：两列 Y1、Y2\ngen diff = Y2 - Y1\n.ttest diff = 0\n\n* 长格式（含变量 Time 与 id）\n.xtset id Time\n.xtreg Y i.Time, fe vce(cluster id)  // 等效于配对检验",
  r:"t.test(Y1, Y2, paired = TRUE, data = d)\n# 或基于差值\n.t.test(Diff, mu = 0, data = d)\n# 差值非正态时的非参数版本\nwilcox.test(Y1, Y2, paired = TRUE, data = d)",
  tests:["差值正态性检验","配对相关系数（干预前后关联）","Cohen's dz 效应量","配对缺失的处理说明"],

  stata:"* 单因素方差分析 + 事后比较\n.oneway Y X, tabulate bonferroni\n\n* 多因素（含交互）\n.anova Y X1##X2\n\n* 事后两两比较\n.pwmean Y, over(X) mcompare(bonferroni)\n\n* 方差齐性检验\n.robvar Y, by(X)",

  pits:["整体 F 显著不等于任意两组差异显著，需做事后比较","多重比较不校正","有序/分类因变量误用 ANOVA（等级≠等距）","方差不齐仍用传统 ANOVA"],

/* 匹配最适配的基础理论：对研究问题做关键词打分 */
function matchTheory(q){
  if(!q) return null;
  var text = q.toLowerCase();
  var bestKey = null, bestScore = 0, bestHits = [];
  for(var key in THEORY_KB){
    var t = THEORY_KB[key], score = 0, hits = [];
    for(var i = 0; i < t.keys.length; i++){
      if(text.indexOf(t.keys[i].toLowerCase()) > -1){ score += 2; hits.push(t.keys[i]); }
    }
    if(score > bestScore){ bestScore = score; bestKey = key; bestHits = hits; }
  }
  if(!bestKey) return null;
  return { key: bestKey, score: bestScore, hits: bestHits };
}
function theoryConfidence(score){
  if(score >= 12) return "高";
  if(score >= 6) return "中";
  return "低";
}
function cnkiUrlOf(q){
  return "https://kns.cnki.net/kns8s/defaultresult/index?korder=SU&kw=" + encodeURIComponent((q || "").slice(0, 40));
}

/* 匹配定性研究方法：对选题文本做关键词打分，返回 Top 3 */
function matchQual(q){
  if(!q) return [];
  var text = q.toLowerCase(), res = [];
  for(var key in QUAL_KB){
    var m = QUAL_KB[key], score = 0, hits = [];
    for(var i = 0; i < m.keys.length; i++){
      if(text.indexOf(m.keys[i].toLowerCase()) > -1){ score += 2; hits.push(m.keys[i]); }
    }
    if(score > 0) res.push({ k: key, s: score, hits: hits });
  }
  res.sort(function(a, b){ return b.s - a.s; });
  return res.slice(0, 3);
}

/* ========== 0.7 研究范式判定（定量 / 定性 / 混合） ========== */
var QUANT_KW = ["影响","效应","相关","回归","显著","假设","变量","政策","因果","差异","检验","统计","样本","数据","模型","系数","概率","测量","实验","干预","比例","增长","平均","得分","关系","回归分析"];
var QUAL_KW = ["访谈","案例","田野","叙事","话语","意义","体验","理解","扎根","民族志","观察","机制","文化","故事","文本","现象","过程","感受","主观","视角","探究","探索","深描","质性"];
function judgeParadigm(q){
  var text = q || "";
  var qn = [], ql = [], i;
  for(i = 0; i < QUANT_KW.length; i++){ if(text.indexOf(QUANT_KW[i]) > -1) qn.push(QUANT_KW[i]); }
  for(i = 0; i < QUAL_KW.length; i++){ if(text.indexOf(QUAL_KW[i]) > -1) ql.push(QUAL_KW[i]); }
  if(ql.length > qn.length && ql.length >= 2) return { kind: "qual", qn: qn, ql: ql };
  if(qn.length > ql.length && qn.length >= 2) return { kind: "quant", qn: qn, ql: ql };
  return { kind: "mixed", qn: qn, ql: ql };
}
function paradigmBar(pd){
  var hits = pd.kind === "quant" ? pd.qn : pd.ql;
  var label, cls, sub;
  if(pd.kind === "quant"){
    label = "定量研究主导"; cls = "p-quant";
    sub = "本选题以变量关系与效应估计为主，将优先推荐定量/计量方法；定性方法作为补充参考。";
  } else if(pd.kind === "qual"){
    label = "定性研究主导"; cls = "p-qual";
    sub = "本选题以意义理解与深描为主，将优先匹配定性研究方法；定量方法作为备选参考。";
  } else {
    label = "混合设计 / 难以判定"; cls = "p-mixed";
    sub = "定量与定性线索并存（定量线索 " + pd.qn.length + " 条，定性线索 " + pd.ql.length + " 条），适合混合方法（三角互证），以下两套方法均给出。";
  }
  return '<div class="paradigm">🎯 研究范式判定：<b class="' + cls + '">' + label + '</b>'
    + '<br><span class="p-sub">' + (pd.kind === "mixed" ? sub : "命中线索：" + esc(hits.join("、")) + "。" + sub) + '</span></div>';
}

function flags(ctx){
  var t = (ctx.question || "") + " " + (ctx.extra || "");
  return {
    policy:    /政策|冲击|试点|改革|实施|执行|干预|新政|法案|制度|上调|下调|推行|出台/.test(t),
    threshold: /断点|阈值|分数线|门槛|临界|截止|划线|达到|跳跃|附近/.test(t),
    endo:      /内生|遗漏变量|反向因果|逆向因果|测量误差|同时性|混淆因素/.test(t),
    instrument:/工具变量|外生变量|作为工具|工具性/.test(t),
    selection: /选择偏误|自选择|选择性|匹配|样本选择|样本偏差|选择效应/.test(t),
    synthetic: /合成|单个地区|单一试点|唯一试点|单个省|一个地区|唯一处理|一个城市|单个城市/.test(t),
    pairedKw:  /前后|配对|重复测量|同一批|跟踪|追踪|两次测量|干预前后|前后测/.test(t),
    normalKw:  /不满足正态|非正态|偏态|离群|重尾|分布严重偏/.test(t),
    meanKw:    /均值|平均|差异|显著不同|是否有别|比较/.test(t),
    influKw:   /影响|相关|作用|因素|决定|预测|效应/.test(t)
  };
}

/* ========== 2. 四维组合评分（0-100） ========== */
function scoreMethod(key, ctx, f){
  var m = KB[key], fit = m.fit, n = ctx.n;
  var s = 100 * (0.40*fit.y[ctx.y] + 0.25*fit.x[ctx.x] + 0.15*fit.d[ctx.data] + 0.20*fit.g[ctx.goal]);

  /* 硬性门控：防止“数据像就能用” */
  if(key === "did"){
    if(ctx.data === "cross" && (f.policy || ctx.goal === "causal")) s *= 0.08;
    else if(ctx.data === "cross") s *= 0.30;
  }
  if(key === "rd"  && !f.threshold) s *= 0.55;
  if(key === "iv"  && !(f.endo || f.instrument)) s *= 0.55;
  if(key === "psm" && !f.selection) s *= 0.60;
  if(key === "scm"){
    if(!f.synthetic) s *= 0.60;
    if(!(ctx.data === "balPanel" || ctx.data === "unbalPanel" || ctx.data === "repeat")) s *= 0.45;
  }

  /* 上下文加分（信号越强越优先） */
  if(key === "did" && f.policy && (ctx.data === "balPanel" || ctx.data === "unbalPanel" || ctx.data === "repeat")) s += 10;
  if(key === "rd" && f.threshold) s += 18;
  if(key === "iv"){ if(f.endo) s += 10; if(f.instrument) s += 12; }
  if(key === "psm" && f.selection) s += 16;
  if(key === "scm" && f.synthetic) s += 15;
  if(key === "paired" && f.pairedKw) s += 15;
  if(key === "nonpara"){ if(f.normalKw) s += 12; if(n && n < 50) s += 12; else if(n && n < 100) s += 6; }
  if(key === "ttest"){ if(f.meanKw) s += 8; if(n && n < 50) s += 5; }
  if(key === "ols" && f.influKw) s += 8;
  if(key === "ologit" && ctx.y === "ordinal") s += 6;

  /* 小样本调整 */
  if(n && n < 50){ if(key === "logit" || key === "ologit" || key === "mlogit") s -= 12; if(key === "rd" || key === "iv") s -= 10; if(key === "scm") s -= 8; }
  if(n && n < 100){ if(key === "mlogit" || key === "ologit") s -= 5; if(key === "rd") s -= 5; }

  return Math.max(0, Math.min(100, Math.round(s)));
}

/* ========== 3. 典型误用识别（不推荐列表） ========== */
function detectMisuses(ctx, scores){
  var out = [], f = flags(ctx);
  function add(k, r){ if(!out.some(function(x){ return x.k === k; })) out.push({k:k, r:r}); }

  /* 纯横截面用 DID（存在阈值断点设计时属 RD 范畴，不提示） */
  if(ctx.data === "cross" && !f.threshold && (f.policy || scores.did >= 55))
    add("did", "纯横截面数据只有单一时间点，没有政策前后的时间维度，无法构造双重差分，识别无效。");
  /* 二元 Y 直接用 OLS */
  if(ctx.y === "binary")
    add("ols", "因变量为二元 0/1，直接用 OLS（线性概率模型）会出现预测概率越出 [0,1]、异方差、误差非正态等问题，应改用 logit/probit。");
  /* 因果目标却只做简单检验 */
  if(ctx.goal === "causal" && ctx.data !== "experiment"){
    if(scores.ttest >= 50)  add("ttest",  "因果目标下仅比较两组均值（t 检验）无法控制混杂变量，不能支撑因果性结论；应借助回归控制、IV、DID、RD 或实验设计。");
    if(scores.chisq >= 50)  add("chisq",  "因果目标下卡方检验仅描述分类变量间的关联，无法排除混杂与反向因果，不能用于因果推断。");
    if(scores.anova >= 50)  add("anova",  "因果目标下 ANOVA 仅检验组间均值差异，未控制协变量与选择机制，难以识别因果效应。");
    if(scores.nonpara >= 50)add("nonpara","因果目标下秩和检验只比较分布位置，无法处理混杂，不能支持因果结论。");
  }
  /* 有序 Y 误用 ANOVA */
  if(ctx.y === "ordinal")
    add("anova", "因变量为有序分类（等级测量），ANOVA 将等级视为等距连续量，违反测量假设，应改用有序 logit 或秩和检验。");
  /* 计数 Y 误用 OLS */
  if(ctx.y === "count")
    add("ols", "计数因变量（非负整数、右偏）用 OLS 会产生负预测值与无效推断，应改用泊松/负二项回归。");
  /* 多分类 Y 误用二元 logit */
  if(ctx.y === "multi")
    add("logit", "因变量为多分类无序变量，二元 logit/probit 只能处理 0/1 结果，应改用多元 logit（mlogit）。");
  /* 连续 Y 误用卡方 */
  if(ctx.y === "continuous")
    add("chisq", "因变量为连续变量，卡方检验针对分类频数，会丢弃大部分信息，应改用 t 检验/ANOVA/回归。");
  /* 面板/重复截面却用独立样本检验 */
  if(ctx.data === "balPanel" || ctx.data === "unbalPanel" || ctx.data === "repeat"){
    if(scores.ttest >= 50) add("ttest", "面板/重复截面数据存在个体内相关性与时间维度，独立样本 t 检验的独立性假设被违反，应使用固定效应模型或 DID。");
    if(scores.chisq >= 50) add("chisq", "面板/重复截面数据用卡方检验忽略了个体内部相关性与时间信息。");
  }
  /* 政策冲击 + 因果目标 + 横截面（RD/IV 等准实验设计属例外） */
  if(f.policy && ctx.goal === "causal" && ctx.data === "cross" && !f.threshold && !f.instrument)
    add("did", "评估政策因果效应需要面板或重复截面数据（或 IV/RD 等准实验设计），当前横截面数据无法排除政策前趋势与选择偏误。");
  /* 存在内生性时 OLS 不宜作主估计量 */
  if(f.endo && ctx.goal === "causal")
    add("ols", "研究情境存在内生性（遗漏变量/反向因果等）时，OLS 估计有偏且不一致，作为主估计量需要 IV（工具需满足相关性与外生性）或准实验设计。");

  return out;
}

/* ========== 4. 推荐方法选择（不同类别、得分相近） ========== */
function recommend(ctx, scores, misuseKeys){
  var ranked = Object.keys(KB)
    .filter(function(k){ return misuseKeys.indexOf(k) === -1; })
    .map(function(k){ return {k:k, s:scores[k]}; })
    .filter(function(x){ return x.s >= 45; })
    .sort(function(a,b){ return b.s - a.s; });
  var picks = [];
  if(ranked.length){
    var top = ranked[0]; picks.push(top);
    for(var i = 1; i < ranked.length; i++){
      var r = ranked[i];
      if(r.s < top.s - 12) break;
      if(KB[r.k].cat !== KB[top.k].cat){ picks.push(r); break; }
    }
    if(picks.length === 1 && ranked.length > 1 && ranked[1].s >= top.s - 5) picks.push(ranked[1]);
  }
  return {picks:picks, ranked:ranked};
}

/* ========== 变量类型智能识别（辅助功能） ========== */
var INFER_RULES = [
  {type:"binary",  w:10, kw:["是否","是/否","0/1","0-1","虚拟变量","哑变量","二分","二值","二元","处理组","对照组","干预组","干预状态","受政策","未受政策","0 表示","1 表示","0=未","1=是","男/女","性别","dummy","treatment","treat"]},
  {type:"ordinal", w:10, kw:["等级","程度","满意度","满意","不同意","同意程度","频率","从不","偶尔","经常","总是","非常","比较满意","一般","不太","完全不","学历","小学","初中","高中","大学","研究生","排名","次序","顺序","李克特","likert","高/中/低","低/中/高","强烈","中立"]},
  {type:"count",   w:10, kw:["次数","个数","件数","访视","住院次数","孩子数量","子女数","专利数","出版物数","论文数","事故次数","发病次数","生育数","计数","非负整数","整数"]},
  {type:"multi",   w:9,  kw:["类别","类型","职业","行业","地区","省份","城市","民族","党派","专业","品牌","颜色","居住地","户籍","婚姻状况","无序","名义变量","类别变量","category","sector"]},
  {type:"continuous", w:9, kw:["分数","得分","金额","收入","工资","价格","支出","年龄","身高","体重","距离","时长","年限","年份","GDP","百分比","比例","汇率","数值","小数","连续","测量值","均值","收益率","增长率","规模","公里","元","万元","度","米","公斤"]}
];

function inferType(name, desc){
  var t = ((name || "") + " " + (desc || "")).toLowerCase();
  if(!t.replace(/\s/g, "")) return null;
  var ranked = [];
  INFER_RULES.forEach(function(r){
    var s = 0, hits = [];
    r.kw.forEach(function(k){
      if(t.indexOf(k.toLowerCase()) !== -1){ s += r.w; hits.push(k); }
    });
    ranked.push({type:r.type, s:s, hits:hits});
  });
  ranked.sort(function(a,b){ return b.s - a.s; });
  var top = ranked[0];
  if(top.s === 0) return {type:null, score:0, hits:[]};
  var second = ranked[1];
  return {
    type: top.type,
    score: top.s,
    hits: top.hits,
    ambiguous: (second.s > 0 && (top.s - second.s) <= 3) ? second.type : null
  };
}

function confidenceLabel(s){
  if(s >= 30) return "置信度高";
  if(s >= 15) return "置信度中";
  if(s >= 5)  return "置信度较低";
  return "线索不足";
}

function mapXType(type){
  if(type === "continuous") return {v:"continuous", note:"连续变量"};
  if(type === "binary")     return {v:"group2", note:"分组二分处理（处理/对照）"};
  if(type === "multi")      return {v:"groupk", note:"多分类分组"};
  if(type === "ordinal")    return {v:null, note:"有序分类变量，请按研究设计选择（可作连续变量或转为分组）"};
  if(type === "count")      return {v:"continuous", note:"计数变量，通常按连续变量处理（右偏时可取对数）"};
  return {v:null, note:"—"};
}

function inferView(target, nameId, descId, kind){
  var name = document.getElementById(nameId).value.trim();
  var desc = document.getElementById(descId).value.trim();
  var el = document.getElementById(target);
  if(!name && !desc){ el.innerHTML = '<div class="c dim">请先输入变量名称或详细描述</div>'; return; }
  var r = inferType(name, desc);
  if(!r || r.type === null){
    el.innerHTML = '<div class="t">无法自动判断</div><div class="c">请补充更具体的描述（取值方式、单位、例子等），或按数据手册手动选择类型。</div>';
    return;
  }
  var h = '<div class="t">推断类型：' + YN[r.type] + '</div>'
    + '<div class="c">' + confidenceLabel(r.score) + '（命中线索：' + (r.hits.length ? r.hits.join("、") : "变量命名") + '）</div>';
  if(r.ambiguous) h += '<div class="c">⚠️ 与「' + YN[r.ambiguous] + '」存在歧义，请结合测量手册确认。</div>';
  if(kind === "y"){
    h += '<button class="btn btn-mini fill" data-act="fill" data-kind="y" data-val="' + r.type + '">填入 Y 类型</button>';
  } else {
    var xm = mapXType(r.type);
    h += '<div class="c">对应 X 表单选项：<b>' + xm.note + '</b></div>';
    if(xm.v) h += '<button class="btn btn-mini fill" data-act="fill" data-kind="x" data-val="' + xm.v + '">填入 X 类型</button>';
  }
  el.innerHTML = h;
}

function runInfer(){
  inferView("i_xres", "i_xname", "i_xdesc", "x");
  inferView("i_yres", "i_yname", "i_ydesc", "y");
}
function clearInfer(){
  ["i_xname","i_xdesc","i_yname","i_ydesc"].forEach(function(id){ document.getElementById(id).value = ""; });
  document.getElementById("i_xres").innerHTML = "";
  document.getElementById("i_yres").innerHTML = "";
}
function fillInfer(e){
  var btn = e.target;
  if(!btn || btn.getAttribute("data-act") !== "fill") return;
  if(btn.getAttribute("data-kind") === "y") document.getElementById("f_y").value = btn.getAttribute("data-val");
  else document.getElementById("f_x").value = btn.getAttribute("data-val");

/* ========== 5. 工具函数 ========== */
function esc(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function buildRationale(key, ctx){
  return KB[key].rationale
    .replace("{q}", ctx.question)
    .replace("{y}", YN[ctx.y])
    .replace("{x}", XN[ctx.x])
    .replace("{d}", DN[ctx.data])
    .replace("{g}", GN[ctx.goal]);
}

/* ========== 6. 分析主流程 ========== */
var lastText = "";

function run(){
  var question = document.getElementById("f_question").value.trim();
  if(!question){ alert("请填写核心研究问题"); return; }
  var nv = parseInt(document.getElementById("f_n").value, 10);
  var ctx = {
    question: question,
    y: document.getElementById("f_y").value,
    x: document.getElementById("f_x").value,
    goal: document.querySelector('input[name="goal"]:checked').value,
    data: document.getElementById("f_data").value,
    n: (isNaN(nv) || nv <= 0) ? null : nv,
    extra: document.getElementById("f_extra").value.trim()
  };
  var f = flags(ctx);
  var scores = {};
  Object.keys(KB).forEach(function(k){ scores[k] = scoreMethod(k, ctx, f); });
  var misuses = detectMisuses(ctx, scores);
  var misuseKeys = misuses.map(function(x){ return x.k; });
  var rec = recommend(ctx, scores, misuseKeys);
  render(ctx, misuses, rec);
}

function render(ctx, misuses, rec){
  var pd = judgeParadigm(ctx.question);
  var picks = rec.picks;
  var hasCausalPick = picks.some(function(p){ return KB[p.k].cat === "causal"; });
  var needCausalWarn = ctx.goal === "causal" && !hasCausalPick && ctx.data !== "experiment";
  var h = "";

  h += '<div class="result-head"><h2>分析结果</h2><button class="btn btn-mini" id="btn_copy">一键复制为纯文本</button></div>';
  h += '<div class="meta-line">研究问题：<b>' + esc(ctx.question) + '</b><br>因变量：<b>' + YN[ctx.y] + '</b> ｜ 自变量：<b>' + XN[ctx.x] + '</b> ｜ 研究目标：<b>' + GN[ctx.goal] + '</b> ｜ 数据结构：<b>' + DN[ctx.data] + '</b> ｜ 样本量：<b>' + (ctx.n ? ctx.n : "未填写") + '</b></div>';

  /* 范式判定：先判定定量/定性主导，再分别分析 */
  h += paradigmBar(pd);
  var isQualFirst = pd.kind === "qual";
  var cnkiUrl = cnkiUrlOf(ctx.question);
  var no = 0;
  var sec = function(t){ no++; return '<h3><span class="no">' + no + '</span> ' + t + '</h3>'; };
  var p1 = "", p2 = "", p3 = "", p4 = "", p5 = "", p6 = "", p7 = "";

  /* 定量模块 1：优先推荐 */
  p1 += '<div class="mod">' + sec(isQualFirst ? '✅ 定量方法（补充参考）' : '✅ 优先推荐方法');
  if(picks.length === 0){
    p1 += '<p>当前输入组合下没有高度匹配的方法（得分均低于阈值）。建议：</p><ul>'
      + '<li>核对变量类型与数据结构是否填写正确；</li>'
      + '<li>补充内生性、断点、选择偏误等关键信息；</li>'
      + '<li>重新审视研究设计，或咨询计量/统计专家。</li></ul>';
  } else {
    picks.forEach(function(p){
      var m = KB[p.k];
      p1 += '<div class="rec-item">'
        + '<div class="r-top"><span class="r-name">' + esc(m.full) + '</span><span class="r-cat">' + CATN[m.cat] + '</span></div>'
        + '<div class="r-intro">' + esc(m.intro) + '</div>'
        + '<div class="score-label">匹配度 ' + p.s + ' / 100</div>'
        + '<div class="scorebar"><i style="width:' + p.s + '%"></i></div>'
        + '<h4>适用前提</h4><ul class="pre">' + m.pre.map(function(x){ return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>'
        + '</div>';
    });
  }
  p1 += '</div>';

  /* 定量模块 2：不建议选用 */
  p2 += '<div class="mod">' + sec('❌ 不建议选用方法');
  if(misuses.length === 0){
    p2 += '<p>未发现明显的方法误用；仍需注意所选方法的适用前提与关键检验。</p>';
  } else {
    misuses.forEach(function(mu){
      p2 += '<div class="bad"><span class="nm">' + esc(KB[mu.k].full) + '</span><span class="wy">' + esc(mu.r) + '</span></div>';
    });
  }
  p2 += '</div>';

  /* 定量模块 3：选择理由 */
  p3 += '<div class="mod">' + sec('📖 选择理由（论文方法论素材）');
  picks.forEach(function(p){ p3 += '<p>' + esc(buildRationale(p.k, ctx)) + '</p>'; });
  if(picks.length === 0) p3 += '<p>请补充研究设计信息后重新分析。</p>';
  if(needCausalWarn){
    p3 += '<div class="warn-note">⚠️ 提示：当前推荐以相关/组间比较为主；若论文目标为严格因果识别，建议补充准实验设计（DID、IV、RD、PSM、SCM 等）或寻找随机化数据来源。</div>';
  }
  p3 += '</div>';

  /* 定量模块 4：实操步骤 */
  p4 += '<div class="mod">' + sec('🛠️ 实操简要步骤（Stata / R）');
  picks.forEach(function(p){
    var m = KB[p.k];
    p4 += '<p><b>' + esc(m.full) + '</b></p>'
      + '<p><b>Stata 操作流程：</b></p><pre>' + esc(m.stata) + '</pre>'
      + '<p><b>R 操作流程：</b></p><pre>' + esc(m.r) + '</pre>'
      + '<p><b>关键检验：</b></p><ul>' + m.tests.map(function(t){ return "<li>" + esc(t) + "</li>"; }).join("") + '</ul>';
  });
  if(picks.length === 0) p4 += '<p>无推荐方法，暂无可提供的操作步骤。</p>';
  p4 += '</div>';

  /* 定量模块 5：常见误区 */
  p5 += '<div class="mod">' + sec('⚠️ 常见误区') + '<ul>';
  var shown = 0;
  picks.forEach(function(p){
    KB[p.k].pits.forEach(function(pt){ if(shown < 5){ p5 += "<li>" + esc(pt) + "</li>"; shown++; } });
  });
  if(shown === 0) p5 += "<li>无推荐方法，暂无常见误区提示。</li>";
  p5 += '</ul></div>';

  /* 模块 6：理论基础与选题匹配分析 */
  var th = matchTheory(ctx.question);
  p6 += '<div class="mod">' + sec('📚 理论基础与选题匹配分析');
  if(!th){
    p6 += '<p>未能在研究问题中识别出明确的理论关键词。建议在问题中补充领域术语（如：教育、收入、健康、创新、社会资本、环境规制、同伴等），以便匹配相应理论基础。</p>'
      + '<p class="th-link">🔍 <a href="' + cnkiUrl + '" target="_blank" rel="noopener">前往知网检索该主题（在线）</a></p>';
  } else {
    var t = THEORY_KB[th.key];
    var conf = theoryConfidence(th.score);
    var pct = Math.min(96, 50 + th.score * 4);
    p6 += '<div class="rec-item">'
      + '<div class="r-top"><span class="r-name">' + esc(t.name) + '</span><span class="r-cat">理论匹配度 ' + pct + '/100 · 置信度' + conf + '</span></div>'
      + '<div class="r-intro">代表人物：' + esc(t.rep) + '<br>核心主张：' + esc(t.intro) + '</div>'
      + '<div class="th-note">🎯 适配理由：研究问题中包含「' + esc(th.hits.join("、")) + '」等关键词，与「' + esc(t.name) + '」的核心关切一致，可作为论文的理论基础。</div>'
      + '<h4>该理论与您研究的匹配之处</h4><ul class="pre">'
      + '<li><b>理论核心关切：</b>该理论围绕「' + esc(t.keys.slice(0, 4).join("、")) + '」等核心概念构建分析框架，重点解释此类现象背后的生成逻辑与作用机制。</li>'
      + '<li><b>与选题的结合点：</b>您的研究问题「' + esc(ctx.question) + '」中所涉的「' + esc(th.hits.join("、")) + '」正是该理论的核心分析对象，理论可为选题提供解释路径与机制线索。</li>'
      + '<li><b>论文运用建议：</b>在理论分析部分阐明「' + esc(t.name) + '」与选题的契合逻辑，据此推导研究假设，并在变量选取、机制检验与结果讨论中回应该理论的预期。</li>'
      + '</ul>'
      + '<p class="th-link">🔍 <a href="' + cnkiUrl + '" target="_blank" rel="noopener">如需进一步查阅相关文献，可前往知网检索该主题（在线）</a></p>'
      + '</div>';
  }
  p6 += '</div>';

  /* 模块 7：定性研究方法匹配 */
  var quals = matchQual(ctx.question);
  p7 += '<div class="mod">' + sec(isQualFirst ? '🎓 推荐定性研究方法' : '🎓 定性研究方法匹配');
  if(quals.length === 0){
    p7 += '<p>未能在选题中识别出定性方法线索。若选题偏探索性/理解性，建议在问题中加入「访谈、案例、文本、田野、话语、机制」等关键词后重试，也可点击下方链接前往知网检索质性研究范式。</p>'
      + '<p class="th-link">🔍 <a href="' + cnkiUrl + '" target="_blank" rel="noopener">前往知网检索该选题（在线）</a></p>';
  } else {
    p7 += '<p>基于选题文本匹配到的质性研究方法（按匹配度排序' + (isQualFirst ? '' : '，可与定量方法三角互证') + '）：</p>';
    quals.forEach(function(qi){
      var m = QUAL_KB[qi.k];
      var pct = Math.min(96, 55 + qi.s * 5);
      p7 += '<div class="rec-item">'
        + '<div class="r-top"><span class="r-name">' + esc(m.name) + '</span><span class="r-cat">匹配度 ' + pct + '/100</span></div>'
        + '<div class="r-intro">' + esc(m.intro) + '</div>'
        + '<div class="th-note">🎯 适配理由：选题包含「' + esc(qi.hits.join("、")) + '」等表述，与该方法适用情境一致。</div>'
        + '<h4>适用情境</h4><p style="font-size:13px;color:#4a5260">' + esc(m.fit) + '</p>'
        + '<h4>实施要点</h4><ul class="pre">' + m.steps.map(function(s){ return "<li>" + esc(s) + "</li>"; }).join("") + '</ul>'
        + '</div>';
    });
    p7 += '<p class="th-link">💡 提示：定性方法适合回答「如何、为何、意义」类问题；若需估计因果效应，可结合定量方法进行混合设计（三角互证）增强说服力。</p>';
  }
  p7 += '</div>';

  /* 按范式排序：定性主导时先定性后定量；其余先定量后定性；理论模块恒置最后 */
  if(isQualFirst){
    h += p7;
    h += p1 + p2 + p3 + p4 + p5;
  } else {
    h += p1 + p2 + p3 + p4 + p5;
    h += p7;
  }
  h += p6;

  h += '<div class="note">本工具仅为辅助参考，正式论文仍需结合前沿文献与审稿人意见进行最终判断。</div>';

  document.getElementById("results").innerHTML = h;
  lastText = buildText(ctx, misuses, rec);
  document.getElementById("btn_copy").addEventListener("click", copyResult);
  document.getElementById("results").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ========== 7. 纯文本输出（论文可粘贴） ========== */
function buildText(ctx, misuses, rec){
  var pd = judgeParadigm(ctx.question);
  var isQualFirst = pd.kind === "qual";
  var L = [];
  L.push("【社科量化研究方法智能选型 · 分析结果】");
  L.push("研究问题：" + ctx.question);
  L.push("因变量：" + YN[ctx.y] + " ｜ 自变量：" + XN[ctx.x] + " ｜ 研究目标：" + GN[ctx.goal] + " ｜ 数据结构：" + DN[ctx.data] + " ｜ 样本量：" + (ctx.n ? ctx.n : "未填写"));
  L.push("");
  var pdLabel, pdDetail;
  if(pd.kind === "quant"){ pdLabel = "定量研究主导"; pdDetail = "命中线索：" + pd.qn.join("、"); }
  else if(pd.kind === "qual"){ pdLabel = "定性研究主导"; pdDetail = "命中线索：" + pd.ql.join("、"); }
  else { pdLabel = "混合设计 / 难以判定"; pdDetail = "定量线索 " + pd.qn.length + " 条，定性线索 " + pd.ql.length + " 条，适合混合方法（三角互证）"; }
  L.push("研究范式判定：" + pdLabel + "（" + pdDetail + "）");
  L.push("");

  var S = {}, i, j;
  var secT = function(key, title){ S[key] = { t: title, c: [] }; };
  var add = function(key, line){ S[key].c.push(line); };

  /* 定性部分 */
  secT("qual", isQualFirst ? "推荐定性研究方法" : "定性研究方法匹配");
  var quals = matchQual(ctx.question);
  if(quals.length === 0){
    add("qual", "未识别出定性方法线索；若选题偏探索性/理解性，可补充访谈、案例、文本、田野、话语等关键词后重试。");
  } else {
    quals.forEach(function(qi){
      var m = QUAL_KB[qi.k];
      add("qual", "• " + m.name + "（匹配度 " + Math.min(96, 55 + qi.s * 5) + "/100）");
      add("qual", "  简介：" + m.intro);
      add("qual", "  适用情境：" + m.fit);
      add("qual", "  实施要点：" + m.steps.join("；"));
      add("qual", "  命中关键词：" + qi.hits.join("、"));
    });
    add("qual", "  提示：定性方法适合回答「如何、为何、意义」类问题；若需估计因果效应，可结合定量方法进行混合设计（三角互证）。");
  }

  /* 定量部分 */
  secT("quant", isQualFirst ? "优先推荐方法（定量补充）" : "优先推荐方法");
  if(rec.picks.length === 0){ add("quant", "当前输入组合下无高度匹配的方法，请核对输入或咨询统计专家。"); }
  rec.picks.forEach(function(p){
    var m = KB[p.k];
    add("quant", "• " + m.full + "（" + CATN[m.cat] + "，匹配度 " + p.s + "/100）");
    add("quant", "  简介：" + m.intro);
    add("quant", "  适用前提：" + m.pre.join("；"));
  });

  secT("bad", "不建议选用方法");
  if(misuses.length === 0){ add("bad", "未发现明显的方法误用；仍需注意所选方法的适用前提。"); }
  misuses.forEach(function(mu){ add("bad", "• " + KB[mu.k].full + "：" + mu.r); });

  secT("why", "选择理由");
  rec.picks.forEach(function(p){ add("why", buildRationale(p.k, ctx)); });

  secT("steps", "实操简要步骤");
  rec.picks.forEach(function(p){
    var m = KB[p.k];
    add("steps", "【" + m.full + "】");
    add("steps", "Stata 操作流程：");
    add("steps", m.stata);
    add("steps", "R 操作流程：");
    add("steps", m.r);
    add("steps", "关键检验：" + m.tests.join("；"));
  });

  secT("pits", "常见误区");
  var shown = 0;
  rec.picks.forEach(function(p){
    KB[p.k].pits.forEach(function(pt){ if(shown < 5){ add("pits", "• " + pt); shown++; } });
  });
  if(shown === 0) add("pits", "暂无。");

  /* 理论部分 */
  secT("theory", "理论基础与选题匹配分析");
  var th = matchTheory(ctx.question);
  if(!th){
    add("theory", "未能从研究问题中识别出明确的理论关键词；建议补充领域术语（如：教育、收入、健康、创新、社会资本、环境规制、同伴等）后重试。");
  } else {
    var t = THEORY_KB[th.key];
    add("theory", "• 匹配理论：" + t.name + "（匹配度 " + Math.min(96, 50 + th.score * 4) + "/100，置信度" + theoryConfidence(th.score) + "）");
    add("theory", "  代表人物：" + t.rep);
    add("theory", "  核心主张：" + t.intro);
    add("theory", "  理论核心关切：围绕「" + t.keys.slice(0, 4).join("、") + "」等核心概念构建分析框架，重点解释此类现象背后的生成逻辑与作用机制。");
    add("theory", "  与选题的结合点：研究问题「" + ctx.question + "」中所涉的「" + th.hits.join("、") + "」正是该理论的核心分析对象，可为选题提供解释路径与机制线索。");
    add("theory", "  论文运用建议：在理论分析部分阐明该理论与选题的契合逻辑，据此推导研究假设，并在变量选取、机制检验与结果讨论中回应该理论的预期。");
    add("theory", "  知网在线检索：" + cnkiUrlOf(ctx.question));
  }

  /* 按范式排序输出 */
  var order = isQualFirst
    ? ["qual", "quant", "bad", "why", "steps", "pits", "theory"]
    : ["quant", "bad", "why", "steps", "pits", "theory", "qual"];
  var CN = ["一", "二", "三", "四", "五", "六", "七"];
  for(i = 0; i < order.length; i++){
    var s = S[order[i]];
    L.push(CN[i] + "、" + s.t);
    for(j = 0; j < s.c.length; j++){ L.push(s.c[j]); }
    L.push("");
  }
  L.push("备注：本工具仅为辅助参考，正式论文仍需结合文献与审稿人意见。");
  return L.join("\n");
}

function copyResult(){
  if(!lastText) return;
  var done = function(){
    var b = document.getElementById("btn_copy");
    if(!b) return;
    b.textContent = "已复制";
    setTimeout(function(){ b.textContent = "一键复制为纯文本"; }, 1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastText).then(done).catch(function(){ fallbackCopy(lastText, done); });
  } else {
    fallbackCopy(lastText, done);
  }
}
function fallbackCopy(t, done){
  var ta = document.createElement("textarea");
  ta.value = t;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
  done();
}
